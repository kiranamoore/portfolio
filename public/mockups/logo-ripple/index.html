<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logo concept — drops ripple into a K</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&family=Krub:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #f5f5f7;
      color: #1d1d1f;
      font-family: "Krub", -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    h1 {
      font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 700;
    }

    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 5;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: linear-gradient(180deg, rgba(255,255,255,0.92), rgba(255,255,255,0));
    }
    .logo-slot {
      width: 56px;
      height: 68px;
      display: block;
    }
    .nav { display: flex; gap: 28px; }
    .nav span {
      font-size: 14px;
      font-weight: 500;
      color: #6e6e73;
      padding: 6px 12px;
    }

    .stage {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 120px 24px 72px;
      background:
        radial-gradient(circle at 78% 42%, rgba(102, 126, 234, 0.18), transparent 42%),
        radial-gradient(circle at 18% 78%, rgba(118, 75, 162, 0.14), transparent 40%),
        linear-gradient(180deg, #ffffff 0%, #f5f5f7 100%);
    }
    .stage h1 {
      font-size: clamp(28px, 4vw, 44px);
      letter-spacing: -0.03em;
      margin-bottom: 10px;
      text-align: center;
    }
    .stage p {
      max-width: 460px;
      text-align: center;
      color: #6e6e73;
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 36px;
    }
    .preview {
      width: min(280px, 70vw);
      aspect-ratio: 100 / 120;
      display: block;
    }
    .note {
      position: fixed;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 6;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #667eea;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(102, 126, 234, 0.28);
      border-radius: 999px;
      padding: 6px 12px;
      backdrop-filter: blur(10px);
    }
    canvas { width: 100%; height: 100%; display: block; }

    @media (max-width: 720px) {
      .nav { gap: 4px; }
      .note { display: none; }
    }
  </style>
</head>
<body>
  <p class="note">Local concept · not on the live site</p>
  <header class="site-header">
    <canvas class="logo-slot" id="logo" aria-label="Logo. Five water drops ripple into the letter K, then the animation repeats."></canvas>
    <nav class="nav" aria-hidden="true">
      <span>Art</span>
      <span>Resume</span>
      <span>Contact</span>
    </nav>
  </header>

  <main class="stage">
    <h1>Five drops ripple into a K</h1>
    <p>The same loop plays in the header, at logo size. Five drops land on the points of the K, the ripples settle into the letter, then it washes away and starts again.</p>
    <canvas class="preview" id="preview" aria-hidden="true"></canvas>
  </main>

  <script>
    const POINTS = [
      { x: 0.24, y: 0.16 },
      { x: 0.76, y: 0.16 },
      { x: 0.24, y: 0.50 },
      { x: 0.24, y: 0.84 },
      { x: 0.76, y: 0.84 },
    ];
    const EDGES = [
      [0, 3],
      [2, 1],
      [2, 4],
    ];
    const CYCLE = 5600;
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    const logo = document.getElementById("logo");
    const preview = document.getElementById("preview");
    const logoCtx = logo.getContext("2d");
    const previewCtx = preview.getContext("2d");

    function clamp(v, a, b) {
      return Math.max(a, Math.min(b, v));
    }

    function smoothstep(edge0, edge1, x) {
      const t = clamp((x - edge0) / (edge1 - edge0), 0, 1);
      return t * t * (3 - 2 * t);
    }

    function fit(canvas, ctx) {
      const rect = canvas.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.max(1, Math.round(rect.width * dpr));
      canvas.height = Math.max(1, Math.round(rect.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { w: rect.width, h: rect.height };
    }

    function ring(ctx, x, y, r, width, alpha) {
      if (alpha < 0.015 || r < 0.5) return;
      const inner = Math.max(0, r - width);
      const outer = r + width;
      const g = ctx.createRadialGradient(x, y, inner, x, y, outer);
      g.addColorStop(0, "rgba(214, 236, 255, 0)");
      g.addColorStop(0.42, "rgba(198, 220, 255, " + (alpha * 0.28) + ")");
      g.addColorStop(0.62, "rgba(140, 164, 232, " + alpha + ")");
      g.addColorStop(0.82, "rgba(118, 75, 162, " + (alpha * 0.22) + ")");
      g.addColorStop(1, "rgba(214, 236, 255, 0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, outer, 0, Math.PI * 2);
      ctx.fill();
    }

    function drop(ctx, x, y, s, squash) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(1 / Math.max(squash, 0.45), squash);
      const g = ctx.createLinearGradient(0, -s * 1.3, 0, s);
      g.addColorStop(0, "#ffffff");
      g.addColorStop(0.42, "#c5d6ff");
      g.addColorStop(0.72, "#667eea");
      g.addColorStop(1, "#764ba2");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(0, -s * 1.45);
      ctx.bezierCurveTo(s * 0.95, -s * 0.25, s * 0.9, s * 0.45, 0, s);
      ctx.bezierCurveTo(-s * 0.9, s * 0.45, -s * 0.95, -s * 0.25, 0, -s * 1.45);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.9)";
      ctx.beginPath();
      ctx.ellipse(-s * 0.22, -s * 0.15, s * 0.18, s * 0.32, -0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function bead(ctx, x, y, r, alpha) {
      const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.35, r * 0.1, x, y, r);
      g.addColorStop(0, "rgba(255,255,255," + alpha + ")");
      g.addColorStop(0.45, "rgba(150, 176, 240, " + alpha + ")");
      g.addColorStop(1, "rgba(118, 75, 162, " + (alpha * 0.95) + ")");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    function draw(ctx, w, h, ms) {
      ctx.clearRect(0, 0, w, h);
      const u = reduce ? 3200 : ((ms % CYCLE) + CYCLE) % CYCLE;
      const fade = reduce ? 1 : 1 - smoothstep(4500, 5300, u);
      const unit = Math.min(w, h);
      const pt = POINTS.map((p) => ({ x: p.x * w, y: p.y * h }));

      ctx.save();
      ctx.globalAlpha = fade;

      pt.forEach((p, i) => {
        const start = 80 + i * 110;
        const fall = clamp((u - start) / 520, 0, 1);
        const eased = fall * fall;
        const landed = fall >= 1;
        const x = p.x + Math.sin(i * 1.7) * w * 0.035 * (1 - eased);
        const y = -unit * 0.22 + (p.y + unit * 0.22) * eased;
        const age = u - (start + 520);

        if (!landed && !reduce) {
          const squash = fall > 0.86 ? 1 - (fall - 0.86) * 2.2 : 1;
          drop(ctx, x, y, unit * 0.055, Math.max(0.55, squash));
          return;
        }

        if (!reduce && age > 0 && age < 1500) {
          const t = age / 1500;
          const fade = Math.pow(1 - t, 1.25);
          ring(ctx, p.x, p.y, unit * (0.08 + t * 0.48), unit * 0.03, fade * 0.9);
          ring(ctx, p.x, p.y, unit * (0.03 + t * 0.3), unit * 0.02, fade * 0.45);
        }

        const splash = !reduce && age > 0 && age < 180 ? 1.35 - (age / 180) * 0.35 : 1;
        const pulse = reduce ? 1 : 1 + Math.sin(u * 0.004 + i) * 0.04;
        bead(ctx, p.x, p.y, unit * 0.062 * splash * pulse, 1);
      });

      EDGES.forEach((edge, i) => {
        const a = pt[edge[0]];
        const b = pt[edge[1]];
        const grow = reduce ? 1 : smoothstep(1680 + i * 260, 2100 + i * 260, u);
        if (grow <= 0) return;
        const g = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
        g.addColorStop(0, "rgba(154, 178, 242, 0.95)");
        g.addColorStop(1, "rgba(118, 75, 162, 0.9)");
        ctx.strokeStyle = g;
        ctx.lineWidth = unit * 0.045;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(a.x + (b.x - a.x) * grow, a.y + (b.y - a.y) * grow);
        ctx.stroke();
        if (grow < 1) {
          bead(
            ctx,
            a.x + (b.x - a.x) * grow,
            a.y + (b.y - a.y) * grow,
            unit * 0.04,
            0.95
          );
        }
      });

      if (!reduce && u > 4500) {
        const t = (u - 4500) / 800;
        ring(ctx, w * 0.5, h * 0.5, unit * (0.08 + t * 0.55), unit * 0.05, (1 - t) * 0.4);
      }

      ctx.restore();
    }

    let logoSize = { w: 56, h: 68 };
    let previewSize = { w: 280, h: 336 };

    function resize() {
      logoSize = fit(logo, logoCtx);
      previewSize = fit(preview, previewCtx);
    }

    function step(now) {
      draw(logoCtx, logoSize.w, logoSize.h, now);
      draw(previewCtx, previewSize.w, previewSize.h, now);
      if (!reduce) requestAnimationFrame(step);
    }

    window.addEventListener("resize", resize);
    resize();
    requestAnimationFrame(step);
  </script>
</body>
</html>
